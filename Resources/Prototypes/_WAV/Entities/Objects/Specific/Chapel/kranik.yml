- type: entity
  name: священный краник
  description: Оторванный краник который раньше был под священную воду
  parent: BaseStorageItem
  id: HolyKranik
  components:
    - type: UseDelay
      delay: 15.0
    - type: Bible
      damage:
        groups:
          Brute: -100
          Airloss: -100
          Burn: -100
      damageOnFail:
        groups:
          Brute: 15
          Airloss: 15
      damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
        groups:
          Burn: 10
    - type: Prayable
      bibleUserOnly: true
    - type: ReactionMixer
      mixMessage: "bible-mixing-success"
      reactionTypes:
        - Holy
    - type: Sprite
      sprite: _WAV/Objects/Specific/Chapel/kranik.rsi
      state: icon
    - type: Item
      size: Small
      sprite: _WAV/Objects/Specific/Chapel/kranik.rsi
    - type: Clothing
      slots:
        - Belt
    - type: Storage
      grid:
        - 0,0,0,1
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: MeleeWeapon # Nyanotrasen - Bibles do Holy damage
      damage:
        types:
          Blunt: 4
          Holy: 20
      heavyRateModifier: 1.25
      heavyDamageBaseModifier: 1
      heavyStaminaCost: 4
      maxTargets: 4
    - type: Tag
      tags:
        - Book
    - type: StealTarget
      stealGroup: Bible
    - type: EmitSoundOnPickup
      sound:  /Audio/_WAV/Items/kranik.ogg
    - type: EmitSoundOnDrop
      sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
    - type: EmitSoundOnLand
      sound:  /Audio/_WAV/Items/pipebum.ogg